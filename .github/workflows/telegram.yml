name: Notify Telegram

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        run: sleep 45
      - name: Send changed HTML links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            api_url="https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}"
            jq_filter='.files[]?.filename | select(test("\\.html$"))'
          else
            api_url="https://api.github.com/repos/${REPOSITORY}/compare/${BEFORE_SHA}...${HEAD_SHA}"
            jq_filter='.files[]?.filename | select(test("\\.html$"))'
          fi

          mapfile -t files < <(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api_url}" \
              | jq -r "${jq_filter}"
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed HTML files; skipping notification."
            exit 0
          fi

          message="OPENCLAW HTML 已公開："
          for file in "${files[@]}"; do
            if [[ "${file}" == "index.html" ]]; then
              url="https://bigdondon421.github.io/"
            else
              encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$file")
              url="https://bigdondon421.github.io/${encoded}"
            fi
            message+=$'\n'"${url}"
          done

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true" \
            > /dev/null
